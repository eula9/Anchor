# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 关闭 Configuration Cache：与 Kotlin 编译任务存在已知的序列化兼容问题
org.gradle.configuration-cache=false

# Kotlin 代码风格
kotlin.code.style=official

# TLS 协议配置，缓解 Maven 仓库 SSL 握手失败
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3
